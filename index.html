<!DOCTYPE html>
<html>
<head>
  <title>New Buddies</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0d1117;
      color: white;
    }

    .card {
      border: 1px solid #444;
      border-radius: 14px;
      padding: 10px;
      margin: 10px;
      display: flex;
      align-items: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 10px #58a6ff;
    }

    img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .title {
      text-align: center;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="title">New Buddies 🤝</div>
  <div id="members"></div>

  <script>
    async function loadMembers() {
      const res = await fetch("https://api.chess.com/pub/club/YOUR-CLUB/members");
      const data = await res.json();

      let members = data.all_time.slice(-3).reverse();

      const container = document.getElementById("members");
      container.innerHTML = "";

      for (let m of members) {
        const profile = await fetch(`https://api.chess.com/pub/player/${m.username}`);
        const pData = await profile.json();

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <img src="${pData.avatar || ''}">
          <div>
            <a href="https://www.chess.com/member/${m.username}" target="_blank">
              @${m.username}
            </a>
          </div>
        `;

        container.appendChild(div);
      }
    }

    loadMembers();
    setInterval(loadMembers, 5000); // refresh every 5 sec
  </script>
</body>
</html>
